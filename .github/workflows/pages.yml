name: Kodi repository

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Leave room for Kodi's add-on checker to report a network failure rather
    # than be cut off: it loads multiple branch indexes, and each may traverse
    # several sources with bounded per-source timeouts.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.17'
          python-version: '3.8'
          enable-cache: false
      - name: Install locked development tools
        run: uv sync --frozen
      - name: Check Python quality
        run: uv run --frozen python -m tools.check quality
      - name: Check lockfile
        run: uv run --frozen python -m tools.check dependencies
      # Kodi's add-on checker validates only repository.jelq and downloads its
      # official indexes from third-party mirrors that can stall or fail it. Run
      # it when the repository add-on or its tooling changed, so it still gates that
      # deployment, and skip it for package imports, which cannot affect it.
      - name: Decide whether the repository add-on needs Kodi's checker
        id: scope
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run --frozen python -m tools.repository_scope --base "$BASE" --head "$HEAD"
      - name: Build site and validate repository add-on for Kodi Omega
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.check == 'true'
        run: uv run --frozen python -m tools.check package
      - name: Build site
        if: github.event_name != 'workflow_dispatch' && steps.scope.outputs.check != 'true'
        run: uv run --frozen python -m tools.catalog build
      - name: Upload Pages site
        if: github.repository == 'ftc2/jelq.github.io' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.repository == 'ftc2/jelq.github.io' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy public Kodi repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
