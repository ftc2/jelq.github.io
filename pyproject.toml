[project]
name = "jelq-kodi-repository"
version = "0.0.0"
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = [
    "kodi-addon-checker==0.0.36",
    "mypy==1.14.1",
    "pytest==8.3.5",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.8"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
extra_checks = true
exclude = ["^site/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
